services:
  db:
    image: postgres:17
    container_name: dosso-db
    ports:
      - "5433:5432" # lokal PostgreSQL 17 kurulumu 5432'yi kullanıyor olabilir
    environment:
      POSTGRES_USER: dosso
      POSTGRES_PASSWORD: dosso
      POSTGRES_DB: dosso_dossi
    volumes:
      - dosso_pgdata:/var/lib/postgresql/data

  # Web geliştirmesi isteğe bağlıdır; mevcut mobil DB/volume korunur.
  db-web:
    image: postgres:17
    profiles: [web]
    ports:
      - "127.0.0.1:5444:5432"
    environment:
      # Yalnız yerel geliştirme değerleri; uygulama bu admin hesabını kullanmaz.
      POSTGRES_USER: dosso_web_admin
      POSTGRES_PASSWORD: dosso_web_admin_local
      POSTGRES_DB: postgres
    volumes:
      - dosso_web_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres/init-web.sql:/docker-entrypoint-initdb.d/10-web.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosso_web_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dosso_pgdata:
  dosso_web_pgdata:
