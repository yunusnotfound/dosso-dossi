name: CI and VPS deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish and deploy the current main revision after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel an in-flight main deployment halfway through a migration.
concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  infrastructure:
    name: Deployment scripts and Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Synthetic validation values only; this job never starts a container.
      POSTGRES_PASSWORD: '11111111111111111111111111111111'
      JWT_SECRET: ci-only-jwt-secret-never-use-in-production
      ADMIN_JWT_SECRET: ci-only-admin-secret-never-use-in-production
      POS_WEBHOOK_SECRET: ci-only-pos-secret-never-use-in-production
      PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret-never-use-in-production
      ADMIN_ORIGINS: https://admin.example.invalid
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check deployment shell syntax
        run: |
          for script in deploy/scripts/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Validate the standalone Compose configuration
        run: docker compose --env-file /dev/null --project-name dosso-dossi-ci --file deploy/compose.production.yml config --quiet
      - name: Validate the optional existing-proxy network merge
        run: docker compose --env-file /dev/null --project-name dosso-dossi-ci --file deploy/compose.production.yml --file deploy/compose.ingress.yml.example config --quiet

  backend:
    name: API build and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dosso_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: dosso_dossi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dosso_ci -d dosso_dossi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dosso_ci:ci-only-not-a-production-secret@127.0.0.1:5432/dosso_dossi_test
      TEST_DATABASE_URL: postgresql://dosso_ci:ci-only-not-a-production-secret@127.0.0.1:5432/dosso_dossi_test
    defaults:
      run:
        working-directory: dosso-dossi-backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dosso-dossi-backend/package-lock.json
      - run: npm ci
      - run: npx --no-install prisma generate
      - run: npm run build
      # Vitest migrates only the explicit local *_test database above.
      - run: npm test

  admin:
    name: Admin build and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dosso-dossi-admin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dosso-dossi-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: /api
      # The existing suites explicitly launch Playwright's Chrome channel.
      - run: npx --no-install playwright install --with-deps chrome
      - run: npm run test:regression
      - run: npm run test:stories

  mobile:
    name: Flutter analysis and unit/widget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dosso-dossi-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Match the locally verified SDK, including Dart 3.11.4.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: flutter/flutter
          ref: db50e20168db8fee486b9abf32fc912de3bc5b6a # Flutter 3.41.6
          path: .flutter-sdk
          persist-credentials: false
      - name: Verify Flutter release metadata and add the SDK to PATH
        run: |
          # Flutter reads its release number from Git tags. Fetch only this tag,
          # and verify it still names the immutable SDK revision checked out above.
          sdk="$GITHUB_WORKSPACE/.flutter-sdk"
          git -C "$sdk" fetch --depth=1 origin refs/tags/3.41.6:refs/tags/3.41.6
          test "$(git -C "$sdk" rev-parse refs/tags/3.41.6)" = db50e20168db8fee486b9abf32fc912de3bc5b6a
          printf '%s/bin\n' "$sdk" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  publish:
    name: Publish ${{ matrix.component }} image
    needs: [infrastructure, backend, admin, mobile]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: dosso-dossi-backend
          - component: admin
            context: dosso-dossi-admin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR using this job's temporary token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish the checked revision
        env:
          COMPONENT: ${{ matrix.component }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE=/api \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" \
            --provenance=true \
            --push "$BUILD_CONTEXT"
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy checked images to the isolated VPS stack
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Use production environment protection where the repository plan supports it.
    # Secrets also work at repository scope; DEPLOY_ENABLED is a repository variable.
    environment: production
    concurrency:
      group: dosso-dossi-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Skip obsolete runs before changing the server
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'is_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists. This older run will not deploy.'
          fi
      - name: Pull and deploy via the restricted SSH receiver
        if: steps.current.outputs.is_current == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-vps.sh
